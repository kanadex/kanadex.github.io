name: release

# 手动打 tag 并 push、在 GitHub 上以这个 tag 发布 release 之后触发：
# 构建站点，把 dist/ 打成 dist.tar.gz，附到该 release 上。
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag to rebuild and attach dist.tar.gz to'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: true

jobs:
  dist:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # package.json 的 build = typecheck + vite build，不再单独跑一次 typecheck
      - run: pnpm run build

      - name: Pack dist
        run: |
          tar -czf dist.tar.gz dist
          ls -lh dist.tar.gz
          sha256sum dist.tar.gz

      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ github.run_id }}
          path: dist.tar.gz
          retention-days: 7

      # --clobber 允许重跑时替换同名资源；release 由 release 事件保证已存在
      - name: Attach to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" dist.tar.gz --clobber
